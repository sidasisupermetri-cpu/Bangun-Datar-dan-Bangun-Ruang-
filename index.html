<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bangun Datar &amp; Bangun Ruang — Media Pembelajaran Interaktif</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&family=STIX+Two+Text:ital,wght@0,500;0,700;1,500&display=swap">
<style>
:root{--bg:#eaf2ff;--card:#fff;--ink:#14213d;--mut:#5b6b85;--line:#dfe7f3;--pri:#2563eb;--on:#fff;--soft:#e3edff;--ok:#15803d;--okbg:#dcfce7;--no:#b91c1c;--nobg:#fee2e2;--fx:#f1f6ff;--fxl:#9dbdf5;--sh:0 14px 34px -22px rgba(30,64,175,.55);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1426;--card:#16213a;--ink:#e8eefa;--mut:#9aabc6;--line:#2a3857;--pri:#7aa7ff;--on:#0c1426;--soft:#1d2f5c;--ok:#4ade80;--okbg:#10361f;--no:#fca5a5;--nobg:#3f1a1d;--fx:#182a52;--fxl:#3d5ca6}}
:root[data-theme=dark]{--bg:#0c1426;--card:#16213a;--ink:#e8eefa;--mut:#9aabc6;--line:#2a3857;--pri:#7aa7ff;--on:#0c1426;--soft:#1d2f5c;--ok:#4ade80;--okbg:#10361f;--no:#fca5a5;--nobg:#3f1a1d;--fx:#182a52;--fxl:#3d5ca6}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:500 15px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg) radial-gradient(circle at 8% -8%,var(--soft),transparent 45%)}
[hidden]{display:none!important}
.view{display:none}.view.on{display:block;animation:in .3s ease}@keyframes in{from{opacity:0}}
.wrap{max-width:1040px;margin:auto;padding:0 16px 40px}
header{text-align:center;padding:20px 16px 6px}
h1{margin:0 0 6px;font-size:clamp(1.7rem,4.4vw,2.6rem);font-weight:900;letter-spacing:-.02em;color:var(--pri)}
header p{margin:0 auto;max-width:520px;color:var(--mut)}
.cr{display:block;margin:0 auto 8px;font-size:.8rem;line-height:1.4;color:var(--mut)}
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding-top:18px}
.card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 16px;background:var(--card);border:2px solid var(--line);border-radius:22px;color:inherit;font:inherit;cursor:pointer;box-shadow:var(--sh);transition:transform .25s,border-color .2s}
.card:hover,.card:focus-visible{transform:translateY(-5px);border-color:var(--pri);outline:none}
.card svg{width:76px;height:76px}.card h3{margin:4px 0 0;font-size:1.1rem}.card p{margin:0;font-size:.82rem;color:var(--mut)}
.card span{margin-top:8px;font-weight:800;font-size:.8rem;color:var(--pri);background:var(--soft);padding:6px 14px;border-radius:99px}
.bar{max-width:1040px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;gap:8px}
.mt{margin:0 0 16px;text-align:center;font-size:clamp(1.3rem,3vw,1.8rem);font-weight:900;color:var(--pri)}
.btn{border:0;border-radius:13px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--pri);color:var(--on);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--fxl);outline-offset:2px}
.btn.gh{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:8px 14px;font-size:.85rem}.btn.on{background:#f59e0b;color:#fff}
.ws{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}@media(max-width:820px){.ws{grid-template-columns:1fr}}
.pn{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--sh);margin-bottom:0}.ls{margin-top:16px}
svg#svg-lingkaran,.pn>svg{width:100%;height:auto;display:block;touch-action:none}
.st{display:flex;gap:12px;align-items:center;padding:13px 15px;border-radius:15px;font-weight:900;margin-bottom:16px;transition:background .25s,color .25s}
.st.ok{background:var(--okbg);color:var(--ok)}.st.no{background:var(--nobg);color:var(--no)}.st small{display:block;font-weight:600;opacity:.9}.ic{font-size:1.5rem}
.ctl{margin-bottom:15px}.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
output{background:var(--soft);color:var(--pri);padding:2px 10px;border-radius:9px;font-weight:800;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:8px;border-radius:9px;-webkit-appearance:none;appearance:none;cursor:pointer;background:linear-gradient(var(--pri),var(--pri)) 0 0/var(--p,50%) 100% no-repeat,var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--pri);box-shadow:0 3px 10px rgba(37,99,235,.45);transition:transform .15s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--pri)}
.pre{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.ck{margin-top:14px;display:grid;gap:8px}
.c{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;font-weight:700;font-size:.88rem}.c i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.75rem;color:#fff}
.c.p{background:var(--okbg);color:var(--ok)}.c.p i{background:#16a34a}.c.f{background:var(--nobg);color:var(--no)}.c.f i{background:#dc2626}
h3{margin:0 0 12px;font-size:1.05rem;display:flex;gap:10px;align-items:center}h3 i{font-style:normal;font-size:.78rem;background:var(--soft);color:var(--pri);padding:3px 10px;border-radius:8px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}.ls .info{margin-top:0}
.it{background:var(--fx);border:1px solid var(--line);border-radius:12px;padding:8px 12px}.it.hi{border-color:var(--fxl)}.it span{display:block;font-size:.75rem;color:var(--mut);font-weight:700}.it b{font-variant-numeric:tabular-nums}
.fx{margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--fx);border:1.5px dashed var(--fxl);font-family:"STIX Two Text","Cambria Math",Georgia,serif;font-size:1.02rem}
.fx h4{margin:0 0 6px;font:800 .9rem Nunito,system-ui,sans-serif;color:var(--pri)}.fx p{margin:3px 0}.fx small{font-family:Nunito,system-ui,sans-serif;color:var(--mut)}
.res{display:inline-block;background:var(--pri);color:var(--on);padding:4px 14px;border-radius:10px;font-weight:700;font-size:1.15rem}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 3px}.fr i{font-style:normal;padding:0 4px}.fr i:first-child{border-bottom:1.5px solid currentColor}
.key{font:600 .82rem Nunito,system-ui,sans-serif!important;color:var(--mut);margin-top:10px!important}
.gr{display:grid;gap:3px;margin:16px auto;padding:8px;background:var(--fx);border:1px solid var(--line);border-radius:14px}.gr i{aspect-ratio:1;background:var(--pri);opacity:.85;border-radius:3px;animation:pop .35s backwards}@keyframes pop{from{transform:scale(0)}}
.tip{text-align:center;color:var(--mut);font-weight:700;margin:8px 0 0}.hs{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:10px;font-weight:700}
select{padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700}
.tabs{display:flex;gap:6px;background:var(--fx);padding:5px;border-radius:12px;margin-bottom:10px}.tabs button{flex:1;border:0;padding:9px;border-radius:9px;background:none;color:var(--mut);font:inherit;font-weight:800;cursor:pointer}.tabs .on{background:var(--card);color:var(--pri);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.chips button{--c:#334155;display:flex;gap:7px;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:.83rem;cursor:pointer;transition:background .2s}
.chips i{width:11px;height:11px;border-radius:50%;background:var(--c)}.chips .on{background:var(--c);color:#fff;border-color:var(--c)}.chips .on i{background:#fff}
.pill{fill:var(--card);stroke-width:1.4}.gl{stroke:var(--line);stroke-width:1}.gl.ax{stroke-width:2}.ext{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:4 4}.drag{fill:transparent;cursor:grab}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:6px 16px 30px}
</style>
</head>
<body>
<main></main>
<footer>Media Pembelajaran Matematika · Bangun Datar &amp; Bangun Ruang</footer>
<script>
/* ── Utilitas ───────────────────────────────────────────── */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS='http://www.w3.org/2000/svg',PI=Math.PI,rad=d=>d*PI/180;
const mk=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.append(e);return e};
const num=v=>(+v).toLocaleString('id-ID',{maximumFractionDigits:2}); // maks. 2 desimal
const dist=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
const unit=(a,b)=>{const d=dist(a,b)||1;return{x:(b.x-a.x)/d,y:(b.y-a.y)/d}};
const add=(p,u,k)=>({x:p.x+u.x*k,y:p.y+u.y*k}),mid=(p,q)=>({x:(p.x+q.x)/2,y:(p.y+q.y)/2});
const angleAt=(v,p,q)=>{const d=Math.abs(Math.atan2(p.y-v.y,p.x-v.x)-Math.atan2(q.y-v.y,q.x-v.x));return(d>PI?2*PI-d:d)*180/PI};
const triArea=(a,b,c)=>Math.abs((b.x-a.x)*(c.y-a.y)-(c.x-a.x)*(b.y-a.y))/2;
const text=(g,x,y,s,fill,size=12)=>{const t=mk('text',{x,y,fill,'font-size':size,'font-weight':800,'text-anchor':'middle','dominant-baseline':'central','font-family':'Nunito,system-ui,sans-serif'},g);t.textContent=s};
const pill=(g,x,y,s,stroke,size=12)=>{const w=s.length*size*.6+16;mk('rect',{x:x-w/2,y:y-11,width:w,height:22,rx:8,class:'pill',stroke},g);text(g,x,y+.5,s,stroke,size)};
const rightMark=(g,v,u1,u2,stroke,s=11)=>{const a=add(v,u1,s),b=add(a,u2,s),c=add(v,u2,s);mk('polyline',{points:[a,b,c].map(q=>`${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' '),fill:'none',stroke,'stroke-width':2},g)};
/* ── Kotak rumus ────────────────────────────────────────── */
const frac=(n,d)=>`<span class="fr"><i>${n}</i><i>${d}</i></span>`;
let box=(t,rows,res,u)=>`<div class="fx"><h4>${t}</h4>${rows.map(r=>`<p>${r}</p>`).join('')}<p><span class="res">${res}</span> <small>${u}</small></p></div>`;
const key=(...x)=>`<p class="key"><b>Keterangan:</b> ${x.join(' · ')}</p>`;
const slider=(l,da,mn,mx,sp,v)=>`<div class="ctl"><div class="ch"><span>${l}</span><output></output></div><input type="range" ${da} min="${mn}" max="${mx}" step="${sp}" value="${v}"></div>`;
const paint=r=>{r.style.setProperty('--p',(r.value-r.min)/(r.max-r.min)*100+'%');$('output',r.parentNode).textContent=num(r.value)+(r.dataset.u||'')};

/* ── Data bangun datar (satu mesin gambar untuk semuanya) ── */
const para=({a,b,s})=>{const r=rad(s),x=b*Math.cos(r),y=b*Math.sin(r);return[{x:0,y:0},{x:a,y:0},{x:a+x,y:y},{x,y}]};
const paraName=p=>p.s===90?(p.a===p.b?'Persegi':'Persegi panjang'):p.a===p.b?'Belah ketupat':'Jajar genjang';
const paraInfo=p=>{const t=p.b*Math.sin(rad(p.s));return[['Bangun',paraName(p),1],['Tinggi t',num(t)],['Keliling',num(2*(p.a+p.b))],['Luas',num(p.a*t)]]};
const paraK=(p,x,y)=>box('Keliling',[`K = ${x} + ${y} + ${x} + ${y} = 2 × (${x} + ${y})`,`K = 2 × (${p.a} + ${p.b})`],`K = ${num(2*(p.a+p.b))}`,'satuan')+key('<b>K</b> keliling',`<b>${x}</b> dan <b>${y}</b> sisi berdekatan`);
const paraL=p=>box('Luas',['L = a × b × sin θ',`L = ${p.a} × ${p.b} × sin ${p.s}°`],`L = ${num(p.a*p.b*Math.sin(rad(p.s)))}`,'satuan²')+key('<b>θ</b> sudut apit kedua sisi');
const kiteLike=(p,s1,s2,name,sub)=>{const ar=p.d1*p.d2/2;return{ok:true,title:'Ini '+name.toUpperCase()+'!',sub,checks:[[true,name==='Belah ketupat'||name==='Persegi'?'Keempat sisi sama panjang':`Dua pasang sisi berdekatan sama panjang (${num(s1)} dan ${num(s2)})`],[true,'Diagonal berpotongan tegak lurus (90°)']],info:[['Bangun',name,1],['d₁ × d₂',`${p.d1} × ${p.d2}`],['Keliling',num(2*(s1+s2))],['Luas',num(ar)]],
 K:box('Keliling',s1===s2?['K = 4 × s',`K = 4 × ${num(s1)}`]:['K = 2 × (s₁ + s₂)',`K = 2 × (${num(s1)} + ${num(s2)})`],`K = ${num(2*(s1+s2))}`,'satuan')+key('<b>s</b> panjang sisi'),
 L:box('Luas',[`L = ${frac(1,2)} × d₁ × d₂`,`L = ${frac(1,2)} × ${p.d1} × ${p.d2}`],`L = ${num(ar)}`,'satuan²')+key('<b>d₁, d₂</b> panjang diagonal')}};
const O4=[['Titik D ke AB',3,0,1],['Titik C ke AB',2,0,1],['Titik A ke CD',0,3,2],['Titik B ke CD',1,3,2]];

const SH=[
{id:'persegi',name:'Persegi',tip:'Keempat sisi sama panjang, keempat sudut 90°.',color:'#2563eb',icon:'16,16 64,16 64,64 16,64',
 sl:[['a','Sisi mendatar (a)',2,10,1,6],['b','Sisi miring / tegak (b)',2,10,1,6],['s','Besar sudut',30,150,1,90,'°']],grids:[[2,2],[5,5],[10,10]],geo:para,
 calc:p=>{const eq=p.a===p.b,rt=p.s===90,ok=eq&&rt;return{ok,title:ok?'Ini PERSEGI!':'Bukan persegi',sub:ok?'Keempat sisi sama panjang & keempat sudut 90°':'Bangun ini adalah '+paraName(p).toLowerCase(),
  checks:[[eq,`Keempat sisi sama panjang (a = ${p.a}, b = ${p.b})`],[rt,`Keempat sudut 90° (sekarang ${p.s}°)`]],info:paraInfo(p),
  K:ok?box('Keliling persegi',['K = s + s + s + s = 4 × s',`K = 4 × ${p.a}`],`K = ${4*p.a}`,'satuan')+key('<b>s</b> panjang sisi'):paraK(p,'a','b'),
  L:ok?box('Luas persegi',['L = s × s = s²',`L = ${p.a}²`],`L = ${p.a*p.a}`,'satuan²')+key('<b>s</b> panjang sisi'):paraL(p)}}},
{id:'persegi-panjang',name:'Persegi Panjang',tip:'Sisi berhadapan sama panjang, sudut 90°.',color:'#0891b2',icon:'8,22 72,22 72,58 8,58',
 sl:[['a','Panjang (p)',2,10,1,6],['b','Lebar (l)',2,10,1,3],['s','Besar sudut',30,150,1,90,'°']],grids:[[3,4],[4,6],[5,8]],geo:para,
 calc:p=>{const rt=p.s===90;return{ok:rt,title:rt?(p.a===p.b?'Persegi panjang istimewa (= persegi)':'Ini PERSEGI PANJANG!'):'Bukan persegi panjang',sub:rt?'Sisi berhadapan sama panjang & keempat sudut 90°':`Sudut belum 90° (sekarang ${p.s}°)`,
  checks:[[true,`Sisi berhadapan sama panjang (p = ${p.a}, l = ${p.b})`],[rt,`Keempat sudut 90° (sekarang ${p.s}°)`]],info:paraInfo(p),K:paraK(p,'p','l'),
  L:rt?box('Luas persegi panjang',['L = p × l',`L = ${p.a} × ${p.b}`],`L = ${p.a*p.b}`,'satuan²')+key('<b>p</b> panjang','<b>l</b> lebar'):paraL(p)}}},
{id:'segitiga',name:'Segitiga',tip:'Tiga sisi, tiga sudut. Titiknya bisa digeser!',color:'#16a34a',icon:'40,12 68,64 12,64',fixed:true,
 sl:[['Ax','Titik A · x',-5,5,.1,0],['Ay','Titik A · y',-5,5,.1,4.2],['Bx','Titik B · x',-5,5,.1,-3],['By','Titik B · y',-5,5,.1,-1],['Cx','Titik C · x',-5,5,.1,3],['Cy','Titik C · y',-5,5,.1,-1]],
 presets:{'Sama sisi':{Ax:0,Ay:4.2,Bx:-3,By:-1,Cx:3,Cy:-1},'Sama kaki':{Ax:0,Ay:4,Bx:-3,By:-2,Cx:3,Cy:-2},'Siku-siku':{Ax:-3,Ay:-2,Bx:3,By:-2,Cx:-3,Cy:3},'Tumpul':{Ax:-4,Ay:-2,Bx:4,By:-2,Cx:0,Cy:1},'Sembarang':{Ax:-3,Ay:-2,Bx:4,By:-3,Cx:1,Cy:4}},
 hopts:[['Tinggi dari C ke AB',2,0,1],['Tinggi dari A ke BC',0,1,2],['Tinggi dari B ke AC',1,0,2]],
 geo:p=>[{x:p.Ax,y:p.Ay},{x:p.Bx,y:p.By},{x:p.Cx,y:p.Cy}],
 calc:(p,V,ho)=>{const[A,B,C]=V,a=dist(B,C),b=dist(C,A),c=dist(A,B),ar=triArea(A,B,C);
  if(ar<.01)return{ok:false,title:'Bukan segitiga',sub:'Ketiga titik segaris atau berimpit',checks:[],info:[],K:'',L:''};
  const an=[A,B,C].map((v,i)=>angleAt(v,V[(i+1)%3],V[(i+2)%3])),eq=(x,y)=>Math.abs(x-y)<.1,
   bs=eq(a,b)&&eq(b,c)?'Sama sisi':eq(a,b)||eq(b,c)||eq(a,c)?'Sama kaki':'Sembarang',
   ba=an.some(x=>Math.abs(x-90)<.6)?'Siku-siku':an.some(x=>x>90)?'Tumpul':'Lancip',
   [,,i,j]=ho||['',0,0,1],base=dist(V[i],V[j]),t=2*ar/base,s=(a+b+c)/2;
  return{ok:true,title:'Segitiga '+bs,sub:'Jenis sudut: '+ba,checks:[],
   info:[['Jenis (sisi)',bs,1],['Jenis (sudut)',ba,1],['a = BC',num(a)],['b = CA',num(b)],['c = AB',num(c)],['∠A',num(an[0])+'°'],['∠B',num(an[1])+'°'],['∠C',num(an[2])+'°'],['Luas',num(ar)]],
   K:box('Keliling segitiga',['K = a + b + c',`K = ${num(a)} + ${num(b)} + ${num(c)}`],`K = ${num(a+b+c)}`,'satuan')+key('<b>a, b, c</b> panjang ketiga sisi'),
   L:box('Luas — alas × tinggi',[`L = ${frac(1,2)} × alas × tinggi`,`L = ${frac(1,2)} × ${num(base)} × ${num(t)}`],`L = ${num(ar)}`,'satuan²')
    +key('<b>t</b> tinggi (garis oranye)')}}},
{id:'jajar-genjang',name:'Jajar Genjang',tip:'Sisi berhadapan sejajar & sama panjang.',color:'#f59e0b',icon:'24,20 72,20 56,60 8,60',
 sl:[['a','Alas (a)',2,10,1,6],['b','Sisi miring (b)',2,10,1,4],['s','Besar sudut',30,150,1,60,'°']],geo:para,hopts:O4,
 calc:p=>{const t=p.b*Math.sin(rad(p.s));return{ok:true,title:'Ini '+paraName(p).toUpperCase()+'!',sub:'Sisi berhadapan sejajar & sama panjang',
  checks:[[true,`Sisi berhadapan sama panjang (a = ${p.a}, b = ${p.b})`],[true,`Sudut berhadapan sama besar (${p.s}° dan ${180-p.s}°)`]],info:paraInfo(p),K:paraK(p,'a','b'),
  L:box('Luas jajar genjang',['L = a × t',`t = b × sin θ = ${p.b} × sin ${p.s}° = ${num(t)}`,`L = ${p.a} × ${num(t)}`],`L = ${num(p.a*t)}`,'satuan²')+key('<b>a</b> alas','<b>t</b> tinggi (garis oranye)')}}},
{id:'trapesium',name:'Trapesium',tip:'Sepasang sisi sejajar dengan panjang berbeda.',color:'#f43f5e',icon:'22,20 58,20 72,60 8,60',
 sl:[['a','Alas bawah (a)',4,12,1,8],['b','Alas atas (b)',2,10,1,4],['t','Tinggi (t)',2,8,1,4],['o','Geser atas (offset)',-4,8,1,2]],hopts:O4,
 geo:p=>[{x:0,y:0},{x:p.a,y:0},{x:p.o+p.b,y:p.t},{x:p.o,y:p.t}],

tabung:['Alas tabung berbentuk lingkaran dengan luas <b>πr²</b>.','Tumpuk lingkaran-lingkaran tipis itu lapis demi lapis sampai setinggi t. Seperti prisma, tiap lapis luasnya sama dengan luas alas.','Volume tabung = luas alas × tinggi = πr² × t.<br><b>V = πr² × t</b>'],
kerucut:['Siapkan sebuah tabung dan sebuah kerucut yang <b>jari-jari (r) dan tingginya (t) sama</b>. Kita akan mencari berapa kerucut air yang dibutuhkan untuk memenuhi tabung.','Isi kerucut dengan air sampai penuh, lalu tuang ke tabung. Tabung baru terisi <b>⅓</b> bagian.','Isi kerucut lagi sampai penuh, lalu tuang. Tabung terisi <b>⅔</b> bagian.','Tuang kerucut ketiga: tabung kini <b>penuh</b>. Dibutuhkan tepat <b>3 kerucut</b> air.',`Tabung penuh = 3 kerucut, jadi 3 × V kerucut = V tabung = πr² × t. Maka V kerucut = ⅓ dari V tabung.<br><b>V kerucut = ${frac(1,3)} × πr² × t = ${frac(1,3)} × luas alas × tinggi</b> (sama seperti limas).`],
bola:['Siapkan sebuah bola kosong dan sebuah kerucut yang jari-jarinya sama dengan bola. Pada bola, tingginya adalah jari-jarinya, jadi tinggi kerucut <b>t = r</b>. Kita akan mencari berapa kerucut air yang dibutuhkan untuk memenuhi bola.','Isi kerucut penuh lalu tuang ke bola: bola terisi <b>¼</b> bagian.','Kerucut kedua: bola terisi <b>½</b> bagian.','Kerucut ketiga: bola terisi <b>¾</b> bagian.','Kerucut keempat: bola <b>penuh</b>. Dibutuhkan tepat <b>4 kerucut</b> air.',`Bola penuh = 4 kerucut, jadi V bola = 4 × V kerucut = 4 × (${frac(1,3)} × πr² × t). Karena t = r, maka πr² × t = πr³.<br><b>V bola = 4 × ${frac(1,3)} × πr³ = ${frac(4,3)}πr³</b>`]};
/* ───────── Pengendali ───────── */
const Z={};
function cap(key,g){const z=Z[key];z.g=g;$('#t-'+key).innerHTML=`<h4>Langkah ${g+1} dari ${z.tx.length}</h4><p>${z.tx[g]}</p>`}
function step(key,g){const z=Z[key];g=Math.max(0,Math.min(z.tx.length-1,g));cap(key,g);const to=z.tgt(g),from=z.v,t0=performance.now(),dur=Math.max(900,Math.abs(to-from)*z.dur);cancelAnimationFrame(z.raf);
 const f=now=>{const p=rm?1:cl((now-t0)/dur);z.v=from+(to-from)*(z.lin?p:ez(p));z.d();const s=$(`[data-sl="${key}"]`);if(s){s.value=z.v/z.max*100;s.style.setProperty('--p',s.value+'%')}if(p<1)z.raf=requestAnimationFrame(f)};z.raf=requestAnimationFrame(f)}
const pane=(key,vb,sl,tip)=>`<svg class="vz${tip?' s3':''}" id="${key}" viewBox="${vb}" role="img" aria-label="Animasi penemuan rumus"></svg>${tip?`<p class="tip">🖱️ Seret gambar untuk memutar (saat masih utuh).</p>`:''}${sl?`<div class="ctl"><div class="ch"><span>${sl}</span></div><input type="range" data-sl="${key}" min="0" max="100" step="1" value="0"></div>`:''}<div class="row"><button class="btn gh sm" data-st="${key}|-1">◀ Sebelumnya</button><button class="btn gh sm" data-pl2="${key}">▶ Putar</button><button class="btn sm" data-st="${key}|1">Berikutnya ▶</button></div><div class="fx" id="t-${key}"></div>`;
const reg_=(key,o)=>Z[key]={key,v:0,g:0,raf:0,...o};
SOL.forEach(id=>{const R=RV(id),dz=$('.dz',R),old=[...dz.children],isN=NEW.includes(id),B=id==='bola',kl='ls-'+id,kv='vs-'+id,col=BY[id].color;
 dz.innerHTML=`<div class="sb"><button class="on" data-sb="${id}|l">📐 Luas permukaan</button><button data-sb="${id}|v">🧊 Volume</button></div><div class="sp" data-sp="l">${pane(kl,'0 0 440 300',B?'Belum ditutup ⟷ Tertutup':'Rakit ⟷ Bongkar',!B)}</div><div class="sp" data-sp="v" hidden></div>`;
 const vp=$('[data-sp=v]',dz);
 if(isN)old.forEach(c=>vp.append(c));
 else{vp.innerHTML=pane(kv,id==='tabung'?'0 0 440 300':'0 0 440 330',null,0);const dt=old.find(c=>c.tagName==='DETAILS'),q=old.find(c=>c.tagName==='svg');dt&&dz.append(dt);if(q){q.style.display='none';dz.append(q)}}
 if(B){reg_(kl,{id,max:5,dur:14000,lin:1,tx:LS[id],tgt:g=>g,sg:v=>Math.round(v*5),gap:15000,d(){dS(this)}});const zz=Z[kl],lo=()=>{const sv=$('#'+kl);if(sv&&sv.parentElement.offsetParent)zz.d();requestAnimationFrame(lo)};if(!rm)lo()}
 else{reg_(kl,{id,col,max:1,dur:1800,yaw:id==='kerucut'?-1.25:id==='tabung'?-1.05:-.55,tx:LS[id],tgt:g=>g?1:0,sg:v=>v<.03?0:v<.97?1:2,gap:3400,d(){dN(this)}});
  const svg=$('#'+kl),z=Z[kl];svg.addEventListener('pointerdown',e=>{z.dr=e.clientX;svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(z.dr==null)return;z.yaw+=(e.clientX-z.dr)*.012;z.dr=e.clientX;z.d()});['pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,()=>z.dr=null))}
 if(id==='tabung')reg_(kv,{id,max:2,dur:1800,tx:VS[id],tgt:g=>g,gap:3400,d(){dT(this)}});
 if(id==='kerucut'||B){const n=B?4:3;reg_(kv,{id,max:n,dur:4600,lin:1,tx:VS[id],tgt:g=>Math.min(g,n),gap:5200,d(){dW(this)}})}
 [kl,kv].forEach(k=>{if(Z[k]){cap(k,0);Z[k].d()}})});
const _rf=refresh;refresh=s=>{_rf(s);const z=Z['ls-'+s.id];if(z&&z.d&&s.id!=='bola')z.d()};
const PLY={};
document.addEventListener('click',e=>{let b;
 if(b=e.target.closest('[data-sb]')){const m=b.dataset.sb.split('|')[1],dz=b.closest('.dz');$$('.sb button',dz).forEach(x=>x.classList.toggle('on',x===b));$$('.sp',dz).forEach(p=>p.hidden=p.dataset.sp!==m);return}
 if(b=e.target.closest('[data-st]')){const[k,d]=b.dataset.st.split('|');return step(k,Z[k].g+ +d)}
 if(b=e.target.closest('[data-pl2]')){const k=b.dataset.pl2,z=Z[k],stop=()=>{clearInterval(PLY[k]);PLY[k]=0;b.textContent='▶ Putar'};if(PLY[k])return stop();b.textContent='⏸ Berhenti';let g=0;step(k,0);
  PLY[k]=setInterval(()=>{if(!RV(z.id).offsetParent)return stop();g=g>=z.tx.length-1?0:g+1;step(k,g)},z.gap)}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.sl;if(!k)return;e.stopPropagation();const z=Z[k],v=e.target.value/100;cancelAnimationFrame(z.raf);z.v=v*z.max;e.target.style.setProperty('--p',e.target.value+'%');z.d();const g=z.sg(v);if(g!==z.g)cap(k,g)},true);
})();
</script>
<style>
.K .fx,.L .fx,.K .key,.L .key{display:none}
#v-kubus .pn.ls,#v-balok .pn.ls,#v-limas-segitiga .pn.ls,#v-limas-segiempat .pn.ls,#v-prisma-segitiga .pn.ls,#v-prisma-segilima .pn.ls,#v-tabung .pn.ls,#v-kerucut .pn.ls,#v-bola .pn.ls{display:none}
#v-kubus .pn.ls:has(.D),#v-balok .pn.ls:has(.D),#v-limas-segitiga .pn.ls:has(.D),#v-limas-segiempat .pn.ls:has(.D),#v-prisma-segitiga .pn.ls:has(.D),#v-prisma-segilima .pn.ls:has(.D),#v-tabung .pn.ls:has(.D),#v-kerucut .pn.ls:has(.D),#v-bola .pn.ls:has(.D){display:block}
</style>
<script>
(()=>{
const host=document.querySelector('#v-kerucut [data-sp="l"]')||document.querySelector('#v-kerucut');
if(!host)return;
const cx=115,cy=140,R=95,ac=365,ar=57,rd=Math.PI/180,P=a=>[cx+R*Math.cos(a*rd),cy+R*Math.sin(a*rd)],A=P(-108),B=P(108);
const fr=(a,b)=>`<span style="display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 3px"><span style="border-bottom:1.5px solid currentColor;padding:0 4px">${a}</span><span>${b}</span></span>`;
const I=[['sel','#ec4899','Luas selimut','<b>Luas selimut</b> = luas juring = <b>L</b>, bagian yang dicari.'],
['big','#2563eb','Luas lingkaran besar','<b>Luas lingkaran besar</b> = π × s × s = <b>πs²</b>. Lingkaran besar berjari-jari s (garis pelukis); juring adalah potongannya.'],
['bus','#be185d','Panjang busur','<b>Panjang busur</b> juring = keliling alas kerucut = <b>2πr</b>, sebab selimut dulu melingkari alas.'],
['kel','#0891b2','Keliling lingkaran besar','<b>Keliling lingkaran besar</b> = 2 × π × s = <b>2πs</b>.']];
const t=(x,y,c,s,z=12)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${z}" font-weight="800" fill="${c}" style="paint-order:stroke;stroke:var(--card);stroke-width:3px;font-family:Nunito,sans-serif">${s}</text>`;
const mid=[(cx+A[0])/2-9,(cy+A[1])/2];
const svg=`<svg id="kp-svg" class="vz" viewBox="0 0 440 285" role="img" aria-label="Juring selimut kerucut di dalam lingkaran besar" style="width:100%;height:auto">
<g data-k="big"><circle cx="${cx}" cy="${cy}" r="${R}" fill="#2563eb" fill-opacity=".14"/>${t(cx,22,'#2563eb','luas lingkaran besar = πs²')}</g>
<g data-k="sel"><path d="M${cx} ${cy}L${A[0]} ${A[1]}A${R} ${R} 0 1 1 ${B[0]} ${B[1]}Z" fill="#ec4899" fill-opacity=".38" stroke="#ec4899" stroke-width="2" stroke-linejoin="round"/>${t(cx+62,cy-4,'#9d174d','luas selimut')}${t(cx+62,cy+12,'#9d174d','= L')}</g>
<g data-k="kel"><circle id="kp-ring" cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>${t(cx,cy+R+22,'#0891b2','keliling lingkaran besar = 2πs')}</g>
<g data-k="bus"><path d="M${A[0]} ${A[1]}A${R} ${R} 0 1 1 ${B[0]} ${B[1]}" fill="none" stroke="#be185d" stroke-width="5" stroke-linecap="round"/><circle cx="${ac}" cy="${cy}" r="${ar}" fill="#ec4899" fill-opacity=".22" stroke="#be185d" stroke-width="3"/>${t(259,cy-16,'#be185d','panjang busur',11.5)}${t(259,cy,'#be185d','= keliling alas',11.5)}${t(259,cy+16,'#be185d','= 2πr',11.5)}${t(ac,cy-ar-8,'#be185d','alas kerucut')}</g>
<g data-k="all"><line x1="${cx}" y1="${cy}" x2="${A[0]}" y2="${A[1]}" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${B[0]}" y2="${B[1]}" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>${t(mid[0],mid[1],'#b45309','s',14)}${t(mid[0],2*cy-mid[1],'#b45309','s',14)}<circle cx="${cx}" cy="${cy}" r="4.5" fill="#fff" stroke="#334155" stroke-width="2.5"/>${t(cx-12,cy+4,'#334155','T',14)}<line x1="${ac}" y1="${cy}" x2="${ac+ar}" y2="${cy}" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>${t(ac+ar/2,cy-9,'#dc2626','r',14)}</g></svg>`;
const chips=I.map(([k,c,l])=>`<button class="btn gh sm" data-kp="${k}"><span style="color:${c}">●</span> ${l}</button>`).join('');
const p='margin:0 0 10px';
const html=`<div class="pn" id="kp-panel" style="margin-top:16px"><h3 style="margin:0 0 4px">🔍 Mengapa luas selimut = πrs?</h3><p style="margin:0 0 8px;color:var(--mut)">Dijelaskan dengan perbandingan juring terhadap lingkaran besar.</p>${svg}
<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${chips}</div><div class="fx" id="kp-info" style="margin-bottom:12px"></div>
<div class="fx" style="line-height:1.75">
<p style="${p}"><b>Langkah 1 – Buka selimut.</b> Selimut kerucut digunting dan dibuka menjadi sebuah <b>juring</b>. Jari-jari juring = garis pelukis <b>s</b>, jadi juring ini adalah potongan dari <b>lingkaran besar</b> berjari-jari s.</p>
<p style="${p}"><b>Langkah 2 – Kenali empat besaran.</b><br><span style="color:#ec4899">●</span> luas selimut (juring) = L (dicari)<br><span style="color:#2563eb">●</span> luas lingkaran besar = πs²<br><span style="color:#be185d">●</span> panjang busur = keliling alas kerucut = 2πr<br><span style="color:#0891b2">●</span> keliling lingkaran besar = 2πs</p>
<p style="${p}"><b>Langkah 3 – Buat perbandingan.</b> Juring adalah sebagian dari lingkaran besar. Besar bagian itu sama, baik dilihat dari luasnya maupun dari panjang busurnya:</p>
<div style="text-align:center;margin:0 0 10px">${fr('luas selimut','luas lingkaran besar')} = ${fr('panjang busur','keliling lingkaran besar')}<br>${fr('L','πs²')} = ${fr('2πr','2πs')}</div>
<p style="${p}"><b>Langkah 4 – Sederhanakan.</b> Ruas kanan: 2π dicoret, tinggal ${fr('r','s')}. Jadi ${fr('L','πs²')} = ${fr('r','s')}. Kalikan kedua ruas dengan πs²:<br>L = πs² × ${fr('r','s')} = πrs <small>(satu s pada s² habis dibagi s)</small></p>
<p style="text-align:center;font-size:1.15rem;margin:0 0 10px"><b>Luas selimut = πrs</b></p>
<p style="${p}"><b>Cek angka</b> (r = 3, s = 5): luas lingkaran besar = 25π, busur = 6π, keliling = 10π. ${fr('L','25π')} = ${fr('6π','10π')} = ${fr('3','5')}, jadi L = ${fr('3','5')} × 25π = 15π = π × 3 × 5 ✓. Sudut juring = ${fr('3','5')} × 360° = 216° (gambar memakai r : s = 3 : 5).</p>
<p style="margin:0"><b>Luas permukaan</b> = luas alas + luas selimut = πr² + πrs = <b>πr(r + s)</b>.</p></div></div>`;
host.insertAdjacentHTML('beforeend',html);
const pn=host.querySelector('#kp-panel'),sv=pn.querySelector('#kp-svg'),ring=pn.querySelector('#kp-ring'),info=pn.querySelector('#kp-info');let cur=null;
sv.querySelectorAll('[data-k]').forEach(g=>g.style.transition='opacity .25s');
const show=k=>{cur=k;sv.querySelectorAll('[data-k]').forEach(g=>g.style.opacity=(!k||g.dataset.k===k||g.dataset.k==='all')?1:.12);ring.setAttribute('stroke-width',k==='kel'?5:2.5);ring.setAttribute('stroke-dasharray',k==='kel'?'none':'2 5');pn.querySelectorAll('[data-kp]').forEach(b=>b.classList.toggle('on',b.dataset.kp===k));info.innerHTML=k?I.find(x=>x[0]===k)[3]:'Ketuk salah satu tombol untuk menandai bagiannya pada gambar.'};
pn.addEventListener('click',e=>{const b=e.target.closest('[data-kp]');if(b)show(cur===b.dataset.kp?null:b.dataset.kp)});
show(null);
})();
</script>
